<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Practice</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .cards {
      display: flex;
      gap: 16px;
      justify-content: space-around;
      border: 2px dashed gray;
      padding: 12px;
    }

    .card {
      height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* vertical centering */
      align-items: flex-end;     /* horizontal centering */
      width: 120px;
      background-color: rgb(255, 226, 165);
      border: 4px solid #ff9f19;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .card.tall {
      height: 260px;
    }
  </style>
</head>
<body>

  <h1>Flexbox practice</h1>

  <div class="cards">
    <div class="card">HTML</div>
    <div class="card tall">CSS</div>
    <div class="card">Java</div>
  </div>

</body>
</html>
